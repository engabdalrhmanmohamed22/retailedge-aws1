name: RetailEdge CI/CD

# ---------------------------------------------------------------------------
# Task 5.1 - Test -> Build -> Deploy (manual approval) with auto-rollback.
#
# Uses GitHub OIDC to assume an AWS IAM role for every AWS call in this
# workflow - no long-lived AWS access keys are ever stored as GitHub
# secrets. Replace ACCOUNT_ID below with your real 12-digit AWS account ID
# once you've created the OIDC role (see the IAM trust policy note at the
# bottom of this file).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: retailedge-app
  ACCOUNT_ID: "026249143418"

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 - Test
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  # ---------------------------------------------------------------------
  # Stage 2 - Build (Docker image -> ECR)
  # ---------------------------------------------------------------------
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/retailedge-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Stage 3 - Deploy (requires manual approval via a protected environment,
  # then a rolling instance refresh; auto-rollback if it fails)
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production   # configure this environment in repo Settings ->
                          # Environments with a required reviewer: that's
                          # what makes this step wait for manual approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/retailedge-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------
      # compute.tf creates the Launch Template with name_prefix, not a
      # fixed name, so AWS appends a random suffix (e.g.
      # "retailedge-lt-20260803233041..."). Look the real name up from the
      # ASG itself instead of hardcoding "retailedge-lt", and reuse it in
      # every later step via $LT_NAME.
      # -----------------------------------------------------------------
      - name: Resolve Launch Template name from the ASG
        id: lt_lookup
        run: |
          LT_NAME=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names retailedge-asg \
            --query 'AutoScalingGroups[0].LaunchTemplate.LaunchTemplateName' \
            --output text)
          if [ -z "$LT_NAME" ] || [ "$LT_NAME" = "None" ]; then
            echo "::error::Could not resolve a Launch Template name from ASG retailedge-asg"
            exit 1
          fi
          echo "Resolved Launch Template name: $LT_NAME"
          echo "LT_NAME=$LT_NAME" >> "$GITHUB_ENV"

      - name: Record current Launch Template version (rollback target)
        id: pre_deploy
        run: |
          PREV_VERSION=$(aws ec2 describe-launch-template-versions \
            --launch-template-name "$LT_NAME" \
            --query 'LaunchTemplateVersions[?VersionNumber==`$Latest`].VersionNumber' \
            --output text --versions '$Latest' 2>/dev/null || echo "unknown")
          echo "previous_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish new Launch Template version
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name "$LT_NAME" \
            --source-version '$Latest' \
            --launch-template-data '{"ImageId":"'"${{ needs.build.outputs.image_uri }}"'"}'

      - name: Start rolling instance refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name retailedge-asg \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":90}' \
            --query 'InstanceRefreshId' --output text)
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for instance refresh to finish
        id: wait
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name retailedge-asg \
              --instance-refresh-ids "${{ steps.refresh.outputs.refresh_id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 30
          done

      # -----------------------------------------------------------------
      # Auto-rollback: if the refresh above failed, roll the ASG back to
      # the previous Launch Template version and notify the team.
      # -----------------------------------------------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name retailedge-asg || true
          aws ec2 modify-launch-template \
            --launch-template-name "$LT_NAME" \
            --default-version "${{ steps.pre_deploy.outputs.previous_version }}"
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name retailedge-asg \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":90}'

      - name: Notify on rollback
        if: failure()
        run: |
          aws sns publish \
            --topic-arn "arn:aws:sns:${{ env.AWS_REGION }}:${{ env.ACCOUNT_ID }}:retailedge-alerts" \
            --subject "Deploy failed - auto-rollback triggered" \
            --message "Deployment ${{ github.sha }} failed health checks during instance refresh. Rolled the ASG back to launch template version ${{ steps.pre_deploy.outputs.previous_version }}."

# ---------------------------------------------------------------------------
# One-time setup this file assumes (not run by the workflow itself):
#
# 1. An IAM role named `retailedge-github-actions-deploy` with a trust
#    policy that allows GitHub's OIDC provider
#    (token.actions.githubusercontent.com) to assume it, scoped to this
#    repo/branch via the `sub` claim - not a static access key/secret pair.
#    Note: repos created after July 15, 2026 get GitHub's new immutable
#    subject claim format (repo:owner@ownerID/repo@repoID:...), so the
#    trust policy's StringLike condition must match that format, not the
#    older name-only "repo:owner/repo:*" pattern.
# 2. A GitHub Environment named `production` (Settings -> Environments)
#    with "Required reviewers" turned on - this is what makes the `deploy`
#    job pause and wait for a human to click Approve before it runs.
# 3. `ACCOUNT_ID` above set to the real AWS account ID.
# 4. compute.tf creates the Launch Template with name_prefix (not a fixed
#    name), so this workflow resolves the real name from the ASG at
#    deploy time instead of hardcoding "retailedge-lt".
# ---------------------------------------------------------------------------
