name: RetailEdge CI/CD

# ---------------------------------------------------------------------------
# Task 5.1 - Test -> Build -> Deploy (manual approval) with auto-rollback.
#
# Uses GitHub OIDC to assume an AWS IAM role for every AWS call in this
# workflow - no long-lived AWS access keys are ever stored as GitHub
# secrets. Replace ACCOUNT_ID below with your real 12-digit AWS account ID
# once you've created the OIDC role (see the IAM trust policy note at the
# bottom of this file).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: retailedge-app
  ACCOUNT_ID: "026249143418"

jobs:
  # ---------------------------------------------------------------------
  # Stage 1 - Test
  # ---------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite unit

  # ---------------------------------------------------------------------
  # Stage 2 - Build (Docker image -> ECR)
  #
  # NOTE ON ARCHITECTURE: this build produces a container image and pushes
  # it to ECR. The app tier in compute.tf, however, is a plain EC2 Auto
  # Scaling Group launched from an AMI (aws_launch_template.app_lt has no
  # user_data/container runtime wired up to pull from ECR). So this stage
  # still validates the app builds cleanly as a container and publishes
  # it to ECR as an artifact, but the Deploy stage below does NOT try to
  # point the Launch Template at this image (an ECR image URI is not a
  # valid AMI ID). See the Deploy stage note for what it does instead, and
  # the "Real container deploy" note at the bottom of this file for what a
  # production version of this would need.
  # ---------------------------------------------------------------------
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/retailedge-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Stage 3 - Deploy (requires manual approval via a protected environment,
  # then a rolling instance refresh; auto-rollback if it fails)
  #
  # NOTE ON ARCHITECTURE: since the app tier boots from a plain AMI (no
  # ECR/container pull wired into it), this stage does not try to publish
  # a new Launch Template version pointed at the image built above - an
  # ECR image URI is not a valid EC2 ImageId, so that call fails by
  # design. What this stage validates instead is the actual mechanism
  # Task 3.1/5.1 are testing: a rolling instance refresh across the ASG,
  # with health-check-gated rollout and an automatic rollback if the
  # refresh fails. That refresh re-launches every instance from the
  # *current* Launch Template version - useful on its own (e.g. to pick
  # up a new Golden AMI via `golden_ami_id`, or after an app_sg/IAM
  # change), and it's the same mechanism a real container-based deploy
  # would still rely on once the image-pull piece exists.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production   # configure this environment in repo Settings ->
                          # Environments with a required reviewer: that's
                          # what makes this step wait for manual approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/retailedge-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Start rolling instance refresh (current Launch Template version)
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name retailedge-asg \
            --preferences '{"MinHealthyPercentage":90,"InstanceWarmup":90}' \
            --query 'InstanceRefreshId' --output text)
          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"
          echo "Started instance refresh $REFRESH_ID for image ${{ needs.build.outputs.image_uri }}"

      - name: Wait for instance refresh to finish
        id: wait
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name retailedge-asg \
              --instance-refresh-ids "${{ steps.refresh.outputs.refresh_id }}" \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Status: $STATUS"
            if [ "$STATUS" = "Successful" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then exit 1; fi
            sleep 30
          done

      # -----------------------------------------------------------------
      # Auto-rollback: if the refresh above failed or timed out, cancel it
      # so the ASG stops mid-rollout and settles back on its existing
      # healthy instances, and notify the team.
      # -----------------------------------------------------------------
      - name: Rollback on failure
        if: failure()
        run: |
          aws autoscaling cancel-instance-refresh \
            --auto-scaling-group-name retailedge-asg || true

      - name: Notify on rollback
        if: failure()
        run: |
          aws sns publish \
            --topic-arn "arn:aws:sns:${{ env.AWS_REGION }}:${{ env.ACCOUNT_ID }}:retailedge-alerts" \
            --subject "Deploy failed - auto-rollback triggered" \
            --message "Deployment ${{ github.sha }} failed health checks during instance refresh. The refresh was cancelled; the ASG remains on its existing healthy instances."

# ---------------------------------------------------------------------------
# One-time setup this file assumes (not run by the workflow itself):
#
# 1. An IAM role named `retailedge-github-actions-deploy` with a trust
#    policy that allows GitHub's OIDC provider
#    (token.actions.githubusercontent.com) to assume it, scoped to this
#    repo/branch via the `sub` claim - not a static access key/secret pair.
#    Note: repos created after July 15, 2026 get GitHub's new immutable
#    subject claim format (repo:owner@ownerID/repo@repoID:...), so the
#    trust policy's StringLike condition must match that format, not the
#    older name-only "repo:owner/repo:*" pattern.
# 2. A GitHub Environment named `production` (Settings -> Environments)
#    with "Required reviewers" turned on - this is what makes the `deploy`
#    job pause and wait for a human to click Approve before it runs.
# 3. `ACCOUNT_ID` above set to the real AWS account ID.
#
# Real container deploy (future work, not done here):
# compute.tf's Launch Template boots from a plain AMI with no user_data
# pulling from ECR, so this workflow builds and pushes a container image
# (useful as a build/artifact check) but deploys via a plain instance
# refresh on the existing AMI, not the container. To actually deploy the
# container that gets built above, either (a) add user_data / a systemd
# unit to app_lt that does `docker pull` + `docker run` for a tag read
# from an SSM Parameter this workflow updates, then trigger the refresh
# so new instances boot with the new tag, or (b) move the app tier to
# ECS/Fargate with a task definition that directly references the ECR
# image, which is what "Publish new Launch Template version" was
# incorrectly modeled after.
# ---------------------------------------------------------------------------
